name: Prepare initial lockfile and migrations
on:
  push:
    branches: [feat/cloudflare-foundation]
    paths: [package.json, server/db/schema.ts, .github/workflows/bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: goodchoice-bootstrap
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate -- --name=initial
      - name: Commit generated files to the migration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json db/migrations
          if ! git diff --cached --quiet; then
            git commit -m 'chore: generate dependency lockfile and initial Drizzle migration'
            git push origin HEAD:feat/cloudflare-foundation
          fi
